name: Read-only preview publication status
on:
  push:
    branches: [quality-v5-architecture-lighting]
    paths: ['.github/workflows/preview-publication-status.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check the published revision and CDN response
        run: |
          node <<'JS'
          (async()=>{
            for(const query of ['?check=v5.3','?check='+Date.now()]){
              const r=await fetch('https://kiyomizu-quality-v5.onrender.com/build-info.json'+query,{signal:AbortSignal.timeout(45000),cache:'no-store'});
              const text=await r.text();
              console.log(JSON.stringify({query,status:r.status,cache:r.headers.get('cache-control'),age:r.headers.get('age'),etag:r.headers.get('etag'),body:text.slice(0,6000)}));
            }
          })().catch(e=>{console.error(e);process.exitCode=1;});
          JS
