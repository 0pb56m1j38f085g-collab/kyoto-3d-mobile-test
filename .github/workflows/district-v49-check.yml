name: Higashiyama v4.18 district and iOS regression
on:
  push:
    branches: [area-higashiyama-quality-v4, area-higashiyama-quality-v4.16, area-higashiyama-illustrated-v4.18]
    paths:
      - 'area-quality-v4/**'
      - 'area-data/**'
      - '.github/workflows/district-v49-check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: district-v49-${{ github.ref }}
  cancel-in-progress: true
jobs:
  webkit:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-jammy@sha256:55db7b712a981e9cc1ec757a4511cd01c5ed4e20bd7c84b2dee4e1d320102b9d
      options: --shm-size=512m
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install fixed WebKit dependency
        timeout-minutes: 5
        run: |
          npm install --prefix "$RUNNER_TEMP/district-check" --no-audit --no-fund playwright@1.55.0
      - name: Check iPhone, iPad, district views and lighting fallback
        env:
          NODE_PATH: ${{ runner.temp }}/district-check/node_modules
        run: |
          node area-quality-v4/tests/frontages.cjs
          node area-quality-v4/tests/footprints.cjs
          node area-quality-v4/tests/district-check.cjs
          node area-quality-v4/tests/storybook.cjs
          node area-quality-v4/tests/metric-landmarks.cjs
          node area-quality-v4/tests/architecture-audit.cjs
          node area-quality-v4/tests/streetscape.cjs
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: higashiyama-v49-district-webkit
          path: district-v49-artifacts/
          retention-days: 14
          if-no-files-found: error
