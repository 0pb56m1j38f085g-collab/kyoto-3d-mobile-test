name: Higashiyama v4.9 district and iOS regression
on:
  push:
    branches: [area-higashiyama-quality-v4, area-higashiyama-quality-v4.9]
    paths:
      - 'area-quality-v4/**'
      - 'area-data/**'
      - '.github/workflows/district-v49-check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: district-v49-${{ github.ref }}
  cancel-in-progress: true
jobs:
  webkit:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: |
          npm install --prefix "$RUNNER_TEMP/district-check" --no-audit --no-fund playwright@1.55.0
          "$RUNNER_TEMP/district-check/node_modules/.bin/playwright" install --with-deps webkit
      - name: Check iPhone, iPad, district views and lighting fallback
        env:
          NODE_PATH: ${{ runner.temp }}/district-check/node_modules
        run: node area-quality-v4/tests/district-check.cjs
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: higashiyama-v49-district-webkit
          path: district-v49-artifacts/
          retention-days: 14
          if-no-files-found: error
