name: Higashiyama camera composition study
on:
  push:
    branches: [area-higashiyama-quality-v4]
    paths:
      - 'area-quality-v4/tests/camera-study.cjs'
      - '.github/workflows/area-camera-study.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  camera:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: |
          npm install --prefix "$RUNNER_TEMP/camera-study" --no-audit --no-fund playwright@1.55.0
          "$RUNNER_TEMP/camera-study/node_modules/.bin/playwright" install --with-deps chromium
      - name: Capture candidate compositions
        env:
          NODE_PATH: ${{ runner.temp }}/camera-study/node_modules
        run: xvfb-run -a node area-quality-v4/tests/camera-study.cjs
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: higashiyama-camera-study
          path: camera-study-artifacts/
          if-no-files-found: error
          retention-days: 7
