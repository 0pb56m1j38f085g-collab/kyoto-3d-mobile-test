name: Fetch Higashiyama OSM reference
on:
  push:
    branches: [area-higashiyama-osm-v1]
    paths:
      - 'area-data/fetch-higashiyama-osm.cjs'
      - '.github/workflows/fetch-higashiyama-osm.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Fetch and compact OSM reference
        run: node area-data/fetch-higashiyama-osm.cjs
      - name: Commit static reference
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add area-data/higashiyama-osm-v1.json area-data/higashiyama-osm-v1-summary.json
          git diff --cached --quiet && exit 0
          git commit -m 'Add compact Higashiyama OSM street and building reference'
          git push origin HEAD:area-higashiyama-osm-v1
      - uses: actions/upload-artifact@v5
        with:
          name: higashiyama-osm-v1
          path: area-data/higashiyama-osm-v1*.json
          retention-days: 14
