name: Higashiyama v4.4 framing study
on:
  push:
    branches: [area-higashiyama-quality-v4]
    paths:
      - 'area-v44-framing-study.cjs'
      - '.github/workflows/area-v44-framing-study.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  framing:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: |
          npm install --prefix "$RUNNER_TEMP/framing" --no-audit --no-fund playwright@1.55.0
          "$RUNNER_TEMP/framing/node_modules/.bin/playwright" install --with-deps chromium
      - name: Capture framing candidates
        env:
          NODE_PATH: ${{ runner.temp }}/framing/node_modules
        run: xvfb-run -a node area-v44-framing-study.cjs
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: higashiyama-v44-framing-study
          path: v44-framing-artifacts/
          if-no-files-found: error
          retention-days: 7
