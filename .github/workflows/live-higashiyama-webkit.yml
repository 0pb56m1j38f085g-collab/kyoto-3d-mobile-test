name: Live Higashiyama WebKit check
on:
  push:
    branches: [area-higashiyama-quality-v4]
    paths:
      - 'live-webkit-check.cjs'
      - '.github/workflows/live-higashiyama-webkit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  webkit:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: |
          npm install --prefix "$RUNNER_TEMP/webkit-check" --no-audit --no-fund playwright@1.55.0
          "$RUNNER_TEMP/webkit-check/node_modules/.bin/playwright" install --with-deps webkit
      - name: Test the live site in WebKit
        env:
          NODE_PATH: ${{ runner.temp }}/webkit-check/node_modules
        run: node live-webkit-check.cjs
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: live-higashiyama-webkit-check
          path: live-webkit-artifacts/
          if-no-files-found: error
          retention-days: 7
