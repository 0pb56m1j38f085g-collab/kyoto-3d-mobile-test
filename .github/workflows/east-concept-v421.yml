name: East area actual 3D full-quality validation
on:
  push:
    branches: [area-higashiyama-scene-v4.22, area-higashiyama-concept-v4.21, area-higashiyama-quality-v4]
    paths: ['area-quality-v4/**', 'area-data/**', '.github/workflows/east-concept-v421.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: east-concept-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Download previously verified lighting (validated against rebuilt geometry)
        uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          name: east-concept-v425-site
          path: .light-cache/
          run-id: '39876204610'
          github-token: ${{ github.token }}
      - name: Build shared geometry and full lighting
        run: node area-quality-v4/build.cjs
        env:
          LIGHT_SAMPLES: '24'
          LIGHT_CACHE_DIR: .light-cache
      - name: Preserve geographic sources and landmark construction
        run: |
          node area-quality-v4/tests/frontages.cjs
          node area-quality-v4/tests/footprints.cjs
          node area-quality-v4/tests/metric-landmarks.cjs
          node area-quality-v4/tests/architecture-audit.cjs
          node area-quality-v4/tests/streetscape.cjs
          node area-quality-v4/tests/storybook.cjs
          node area-quality-v4/tests/stone-streets.cjs
      - name: Verify every packed light index and geographic ordering
        run: |
          node area-quality-v4/tests/concept-pack.cjs
          node area-quality-v4/tests/uphill-framing.cjs
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: east-concept-v425-site
          path: area-quality-v4/site/
          retention-days: 14
  browser:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [webkit, chromium]
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-jammy@sha256:55db7b712a981e9cc1ec757a4511cd01c5ed4e20bd7c84b2dee4e1d320102b9d
      options: --shm-size=512m
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@v5
        with:
          name: east-concept-v425-site
          path: area-quality-v4/site/
      - run: npm install --prefix "$RUNNER_TEMP/concept-browser" --no-audit --no-fund playwright@1.55.0
      - name: Render actual full-quality 3D and test interactions
        run: node area-quality-v4/tests/concept-browser.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/concept-browser/node_modules
          TEST_BROWSER: ${{ matrix.engine }}
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: east-concept-v425-${{ matrix.engine }}
          path: concept-v425-artifacts/
          retention-days: 14

  evidence:
    needs: [build, browser]
    if: always()
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          pattern: east-concept-v425-*
          path: evidence/current/
      - uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          pattern: east-concept-v421-*
          path: evidence/previous/
          run-id: '39869579512'
          github-token: ${{ github.token }}
      - name: Preserve review images and reports on a separate evidence branch
        uses: actions/github-script@v8
        with:
          script: |
            const fs=require('fs'),path=require('path');
            const files=[];
            function walk(dir,prefix){
              if(!fs.existsSync(dir))return;
              for(const name of fs.readdirSync(dir)){
                const full=path.join(dir,name);
                if(fs.statSync(full).isDirectory())walk(full,prefix+'/'+name);
                else if(/\.png$|report\.json$|build-info\.json$/.test(name))files.push({full,path:prefix+'/'+name});
              }
            }
            walk('evidence/current','verification/v4.25-ci');
            walk('evidence/previous','verification/v4.24-final-recovered');
            const entries=[];
            for(const f of files){
              const blob=await github.rest.git.createBlob({...context.repo,content:fs.readFileSync(f.full).toString('base64'),encoding:'base64'});
              entries.push({path:f.path,mode:'100644',type:'blob',sha:blob.data.sha});
            }
            entries.push({path:'verification/v4.25-ci/run.json',mode:'100644',type:'blob',content:JSON.stringify({source:context.sha,run:context.runId,physicalDevice:false,scope:'CI screenshots and reports; visual review and publication tracked separately'},null,2)});
            const source=await github.rest.git.getCommit({...context.repo,commit_sha:context.sha});
            const tree=await github.rest.git.createTree({...context.repo,base_tree:source.data.tree.sha,tree:entries});
            const commit=await github.rest.git.createCommit({...context.repo,message:'Preserve v4.25 CI review evidence for '+context.sha,tree:tree.data.sha,parents:[context.sha]});
            const branch='evidence/east-town-'+context.runId;
            await github.rest.git.createRef({...context.repo,ref:'refs/heads/'+branch,sha:commit.data.sha});
            core.notice('Review evidence: '+branch+' @ '+commit.data.sha);
