name: Public v4.16 WebKit frame presentation
on:
  push:
    branches: [area-higashiyama-quality-v4.16]
    paths: ['verification/webkit-v416.cjs', '.github/workflows/webkit-public-v416.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    # Official 1.55.0 jammy image: browser and OS dependencies already installed.
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-jammy@sha256:55db7b712a981e9cc1ec757a4511cd01c5ed4e20bd7c84b2dee4e1d320102b9d
      options: --shm-size=512m
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Prepare WebKit
        timeout-minutes: 5
        run: |
          npm install --prefix "$RUNNER_TEMP/webkit-capture" --no-audit --no-fund playwright@1.55.0
      - name: Capture after actual frames and presentation ticks
        env:
          NODE_PATH: ${{ runner.temp }}/webkit-capture/node_modules
        run: node verification/webkit-v416.cjs
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: public-v416-webkit-frames
          path: webkit-public-artifacts/
          if-no-files-found: error
          retention-days: 14
