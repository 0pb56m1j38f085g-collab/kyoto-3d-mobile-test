name: Higashiyama area visual quality v3
on:
  push:
    branches: [area-higashiyama-quality-v3]
    paths:
      - 'area-preview/**'
      - '.github/workflows/area-quality-v3.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: higashiyama-area-quality-v3
  cancel-in-progress: true
jobs:
  visual:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Syntax check
        run: |
          node --check area-preview/src/renderer.js
          node --check area-preview/src/scene.js
          node --check area-preview/src/app.js
          node --check area-preview/tests/visual-check.cjs
      - name: Install fixed browser dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/area-browser" --no-audit --no-fund playwright@1.55.0
          "$RUNNER_TEMP/area-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Render all area quality views
        env:
          NODE_PATH: ${{ runner.temp }}/area-browser/node_modules
        run: xvfb-run -a node area-preview/tests/visual-check.cjs
      - name: Upload area renders and results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: higashiyama-area-quality-v3-renders
          path: area-quality-artifacts/
          if-no-files-found: error
          retention-days: 7
