name: Higashiyama area quality v4 validation
on:
  push:
    branches: [area-higashiyama-quality-v4]
    paths:
      - 'area-quality-v4/**'
      - 'quality-v5/bake_vertex.cpp'
      - '.github/workflows/area-quality-v4-validate.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: higashiyama-area-quality-v4-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Compose and validate the full area geometry
        run: node area-quality-v4/build.cjs --validate-only
