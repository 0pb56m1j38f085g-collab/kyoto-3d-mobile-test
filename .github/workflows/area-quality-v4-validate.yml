name: Higashiyama area quality v4 validation
on:
  push:
    branches: [area-higashiyama-quality-v4]
    paths:
      - 'area-quality-v4/**'
      - 'quality-v5/bake_vertex.cpp'
      - '.github/workflows/area-quality-v4-validate.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: higashiyama-area-quality-v4-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Compose and validate the full area geometry
        shell: bash
        run: |
          set +e
          node area-quality-v4/build.cjs --validate-only > area-v4-validation.log 2>&1
          code=$?
          cat area-v4-validation.log
          exit $code
      - name: Save validation log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: higashiyama-area-v4-validation-log
          path: area-v4-validation.log
          if-no-files-found: error
          retention-days: 7
